name: deploy


on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy to'
        required: false
        type: choice
        options:
          - development
          - production
      version:
        description: 'The required version'
        type: string
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
     - name: Checkout
       uses: actions/checkout@v4
       with:
         ref: ${input.version}
         
     - name: cat
       run: cat ./github/workflows/deploy.yml

     - name: Create data
       run: echo ${{ inputs.environment || 'development' }} > env_name.txt

     - name: Trigger Workflow B with Inputs
       uses: actions/github-script@v7
       with:
          github-token: 
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,                 // Change this if Workflow B is in a different repo
              workflow_id: 'workflow_b.yml',           // The exact file name of Workflow B
              ref: 'main',                             // The branch to run Workflow B on
              inputs: {
                environment: 'production',             // Passing inputs directly
                version: 'v2.4.0'
              }
            });
           
       

